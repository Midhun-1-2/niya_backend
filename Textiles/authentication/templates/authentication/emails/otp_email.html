<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Niya Collections verification code</title>
</head>
<body style="margin:0; padding:0; background-color:#f1e2cc; font-family: Georgia, 'Times New Roman', serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1e2cc; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#fff8f1; border:1px solid #d9b66e; border-radius:16px; overflow:hidden;">

          <tr>
            <td style="background-color:#6f1020; padding:28px 32px; text-align:center;">
              <span style="display:inline-block; color:#e4c77a; font-size:12px; letter-spacing:3px; text-transform:uppercase; font-family: Arial, Helvetica, sans-serif;">Niya Collections</span>
            </td>
          </tr>

          <tr>
            <td style="padding:36px 32px 8px; text-align:center;">
              <h1 style="margin:0 0 12px; color:#6f1020; font-size:22px; font-family: Georgia, 'Times New Roman', serif;">{{ heading }}</h1>
              <p style="margin:0; color:#6f6f6f; font-size:14px; line-height:1.6; font-family: Arial, Helvetica, sans-serif;">
                Hi {{ name }}, {{ intro }}
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:28px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="background-color:#fbf3e1; border:1px dashed #c89b3c; border-radius:12px; padding:20px;">
                    <span style="font-family: Arial, Helvetica, sans-serif; font-size:34px; font-weight:bold; letter-spacing:10px; color:#4a0a15;">{{ otp }}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px 32px; text-align:center;">
              <p style="margin:0; color:#6f6f6f; font-size:13px; font-family: Arial, Helvetica, sans-serif;">
                This code expires in {{ expiry_minutes }} minutes. If you didn't request this, you can safely ignore this email.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:18px 32px; background-color:#f6e8d5; text-align:center; border-top:1px solid #e8d5a8;">
              <p style="margin:0; color:#0e4f46; font-size:11px; letter-spacing:1px; text-transform:uppercase; font-family: Arial, Helvetica, sans-serif;">
                Handwoven heritage, delivered with care
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
